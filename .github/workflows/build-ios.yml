name: Build iOS (unsigned .ipa)

# experimento para ver si el framework fork banca iOS y sacar un .ipa unsigned para
# sideloadear (AltStore lo re-firma). corre al pushear ESTA branch; no toca releases
# (build-gu solo dispara en main/master/develop).
on:
  push:
    branches: [ ci/ios-build-test ]
  workflow_dispatch:

env:
  FRAMEWORK_REPOSITORY: 'ShikkesoraSIM/torii-framework'
  FRAMEWORK_REF: '80e9490aa0464f57084e4c1cfbb8adffb98de27c'
  RESOURCES_REPOSITORY: 'ShikkesoraSIM/torii-resources'
  RESOURCES_REF: '25ad583064fb19ecd604813446226cb5c0c7bd35'
  VELDRID_REPOSITORY: 'ShikkesoraSIM/torii-veldrid'
  VELDRID_REF: '99a6ad4a0c52ad08e3f01d5b7731c18d333f0086'

jobs:
  build-ios:
    name: Build iOS (net8, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout osu-framework dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRAMEWORK_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.FRAMEWORK_REF }}
          path: osu-framework

      - name: Checkout osu-resources dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESOURCES_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.RESOURCES_REF }}
          path: osu-resources

      - name: Checkout torii-veldrid dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VELDRID_REPOSITORY }}
          fetch-depth: 0
          ref: ${{ env.VELDRID_REF }}
          path: torii-veldrid

      - name: Place dependencies in expected sibling paths
        shell: bash
        run: |
          rm -rf ../osu-framework ../osu-resources ../torii-veldrid
          mv osu-framework ../osu-framework
          mv osu-resources ../osu-resources
          mv torii-veldrid ../torii-veldrid

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # el toolchain del repo es net10; los cabezales iOS son net8.0-ios y el sdk net10
      # no los resuelve (TargetPlatformVersion=1.0 -> NETSDK1135). en vez de pelear con
      # eso, subimos los cabezales iOS a net10.0-ios para que matcheen el toolchain. en
      # iOS igual es Mono AOT + Metal (NO hay Satori ni D3D12) pero compila parejo.
      - name: Bump iOS heads to net10.0-ios (match the net10 toolchain)
        shell: bash
        run: |
          for f in osu.iOS/osu.iOS.csproj ../osu-framework/osu.Framework.iOS/osu.Framework.iOS.csproj; do
            if [[ -f "$f" ]]; then
              sed -i.bak 's#net8\.0-ios#net10.0-ios#g' "$f"
              echo "== $f =="; grep -i "TargetFramework" "$f" | head -2
            else
              echo "!! no existe: $f"
            fi
          done

      - name: Pack Torii.Veldrid into local NuGet feed
        shell: bash
        run: |
          cd ../torii-veldrid
          for proj in src/Veldrid/Veldrid.csproj src/Veldrid.MetalBindings/Veldrid.MetalBindings.csproj src/Veldrid.OpenGLBindings/Veldrid.OpenGLBindings.csproj; do
            if [[ -f "$proj" ]]; then
              echo "Packing $proj"
              dotnet pack "$proj" -c Release -o bin/Packages/Release --nologo
            fi
          done
          echo "Local feed contents:"
          ls -la bin/Packages/Release | tail -20

      # el runner trae Xcode 26.3 como default (+ varios 16.x). net10.0-ios = iOS 26, asi
      # que usamos el default 26.3 y NO reinstalamos el workload: el pre-instalado del
      # runner matchea su Xcode 26.3. (mi 'workload install ios' lo subia a 26.5, que
      # exige Xcode 26.5 y el runner no lo tiene -> el mismatch que veniamos pegando.)
      - name: Use runner default Xcode + report workload
        shell: bash
        run: |
          echo "xcode dir: $(xcode-select -p)"
          xcodebuild -version || true
          echo "--- workloads instalados en el runner ---"
          dotnet workload list || true

      # PASO CLAVE (make-or-break): compila el framework fork + el juego para iOS.
      # si el fork no banca iOS, revienta ACA y ya sabemos que iOS no va sin laburo.
      # CheckEolTargetFramework=false: el SDK de net10 marca net8.0-ios como EOL y
      # tira error NETSDK1202 por politica (no es un error real). lo apagamos.
      - name: Compile check (osu.iOS)
        shell: bash
        run: dotnet build osu.iOS/osu.iOS.csproj -c Release -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false -p:TreatWarningsAsErrors=false

      # best-effort: build de dispositivo (ios-arm64) sin firmar + empaquetar .ipa.
      # unsigned a proposito -> AltStore lo re-firma con tu Apple ID al instalarlo.
      - name: Build device .app + package unsigned .ipa
        id: pack
        continue-on-error: true
        shell: bash
        run: |
          set -x
          dotnet build osu.iOS/osu.iOS.csproj -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CheckEolWorkloads=false \
            -p:CheckEolTargetFramework=false \
            -p:TreatWarningsAsErrors=false \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:CodesignKey= \
            -p:ArchiveOnBuild=false
          APP=$(find osu.iOS/bin/Release -maxdepth 5 -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          if [[ -z "$APP" ]]; then echo "no .app produced — packaging skipped"; exit 1; fi
          rm -rf payload_stage && mkdir -p payload_stage/Payload
          cp -R "$APP" payload_stage/Payload/
          ( cd payload_stage && zip -qr ../torii-ios-unsigned.ipa Payload )
          ls -la torii-ios-unsigned.ipa

      - name: Upload unsigned .ipa
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: torii-ios-unsigned-ipa
          path: torii-ios-unsigned.ipa
          if-no-files-found: warn
