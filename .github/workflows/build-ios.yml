name: Build iOS (unsigned .ipa)

# .ipa unsigned de Torii (master/net8) con TODOS los features, para sideloadear con AltStore.
# corre al pushear ESTA branch; no toca releases (build-gu solo dispara en main/master/develop).
# CAMINO net8.0-ios: el runner tiene Xcode 16.4, que es el que quiere net8-ios; net10-ios
# pediria Xcode 26.5 (no esta). NO es Nova: en iOS igual seria Mono AOT + Metal (sin Satori/D3D12).
#
# SMOOTH: apunta al framework con el clamp de Hz movil (ios-mobile-hz-clamp @ df082dd3a). el fork
# corria input/audio/update a 2000hz en iOS (un solo core -> se fundia). ahora clampea a 240hz en
# movil = mismo comportamiento que vanilla (que anda de lujo) pero manteniendo los features de Torii.
on:
  push:
    branches: [ ci/ios-build-test ]
  workflow_dispatch:

env:
  FRAMEWORK_REPOSITORY: 'ShikkesoraSIM/torii-framework'
  FRAMEWORK_REF: 'df082dd3a22e1e4067a09de63af5a4d978be0a2e'
  RESOURCES_REPOSITORY: 'ShikkesoraSIM/torii-resources'
  RESOURCES_REF: '25ad583064fb19ecd604813446226cb5c0c7bd35'
  VELDRID_REPOSITORY: 'ShikkesoraSIM/torii-veldrid'
  VELDRID_REF: '99a6ad4a0c52ad08e3f01d5b7731c18d333f0086'

jobs:
  build-ios:
    name: Build iOS (net8, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout osu-framework dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRAMEWORK_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.FRAMEWORK_REF }}
          path: osu-framework

      - name: Checkout osu-resources dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESOURCES_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.RESOURCES_REF }}
          path: osu-resources

      - name: Checkout torii-veldrid dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VELDRID_REPOSITORY }}
          fetch-depth: 0
          ref: ${{ env.VELDRID_REF }}
          path: torii-veldrid

      - name: Place dependencies in expected sibling paths
        shell: bash
        run: |
          rm -rf ../osu-framework ../osu-resources ../torii-veldrid
          mv osu-framework ../osu-framework
          mv osu-resources ../osu-resources
          mv torii-veldrid ../torii-veldrid

      # SOLO net8: nada de net10 para que no haya ambiguedad de SDK.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # el repo pinea net10 en su global.json; lo pisamos por net8 y ABORTAMOS si no
      # quedo en 8.x (asi no volvemos a buildear sin querer con el sdk net10).
      - name: Force .NET 8 SDK + verify
        shell: bash
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF
          V=$(dotnet --version)
          echo "dotnet --version = $V"
          case "$V" in
            8.*) echo "OK, SDK net8" ;;
            *) echo "ERROR: no quedo en net8 (es $V)"; exit 1 ;;
          esac

      - name: Use Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Install iOS workload (net8 band)
        shell: bash
        run: |
          dotnet workload install ios
          echo "--- workloads ---"
          dotnet workload list

      - name: Pack Torii.Veldrid into local NuGet feed
        shell: bash
        run: |
          cd ../torii-veldrid
          for proj in src/Veldrid/Veldrid.csproj src/Veldrid.MetalBindings/Veldrid.MetalBindings.csproj src/Veldrid.OpenGLBindings/Veldrid.OpenGLBindings.csproj; do
            if [[ -f "$proj" ]]; then
              echo "Packing $proj"
              dotnet pack "$proj" -c Release -o bin/Packages/Release --nologo
            fi
          done
          ls -la bin/Packages/Release | tail -20

      # build de dispositivo (ios-arm64) con INTERPRETE (esquiva el crash del AOT), sin
      # firmar, + empaquetar el .ipa. este build ya compila el managed primero, asi que
      # si hay un error de codigo real, revienta aca (no hace falta un compile-check aparte).
      - name: Build device .app + package unsigned .ipa
        id: pack
        shell: bash
        run: |
          set -x
          # diagnostico: qué propiedad controla el dedup / aot-instances.dll en el SDK
          SDKT=$(find /Users/runner/.dotnet/packs -name "Xamarin.Shared.Sdk.targets" 2>/dev/null | head -1)
          echo "=== SDK targets: $SDKT ==="
          grep -inE "dedup|aot-instances|AOTInstances|DedupAssembly" "$SDKT" 2>/dev/null | head -25 || true
          # el AOT crasheaba (exit 139) en Vortice.Direct3D12.dll (binding D3D12 de Windows que se cuela en
          # iOS y no corre nunca) + aot-instances.dll (del dedup). fix: interpretar TODO menos el hot-path
          # (osu.Framework = loop de draw/update/input; juego + rulesets = gameplay -> AOT nativo = rapido).
          # el valor va en osu.iOS.props porque en la CLI las comas rompen MSBuild (MSB1006).
          echo "=== patch osu.iOS.props: MtouchInterpreter hibrido (AOT el hot-path GRAFICO) ==="
          # el hot-path por-frame en iOS es Veldrid (traduce draw calls a Metal) + MetalBindings. si eso
          # corre INTERPRETADO (como en el build hibrido viejo) cada frame pasa por el interprete de Mono
          # -> jank (por eso vanilla full-AOT vuela y el fork hibrido no). asi que ademas del framework/juego/
          # rulesets, AOT-eamos Veldrid + MetalBindings + SPIRV + ManagedBass (todo lo que se toca cada frame).
          # Vortice.Direct3D12 (el que crasheaba el AOT, exit 139) SIGUE interpretado: en iOS es codigo muerto
          # (el renderer es Metal), nunca se ejecuta, asi que interpretarlo no cuesta nada.
          sed -i.bak 's#<MtouchInterpreter>-all</MtouchInterpreter>#<MtouchInterpreter>all,-osu.Framework,-osu.Framework.iOS,-osu.Game,-osu.Game.Rulesets.Osu,-osu.Game.Rulesets.Mania,-osu.Game.Rulesets.Taiko,-osu.Game.Rulesets.Catch,-ppy.Veldrid,-ppy.Veldrid.MetalBindings,-ppy.Veldrid.SPIRV,-ppy.ManagedBass</MtouchInterpreter>#' osu.iOS.props
          grep -n "MtouchInterpreter" osu.iOS.props
          echo "=== build: AOT hot-path + interpretar el resto (Vortice/D3D12 incluido) + dedup off ==="
          dotnet build osu.iOS/osu.iOS.csproj -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:_IsDedupEnabled=false \
            -p:CheckEolWorkloads=false \
            -p:CheckEolTargetFramework=false \
            -p:TreatWarningsAsErrors=false \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:CodesignKey= \
            -p:ArchiveOnBuild=false
          APP=$(find osu.iOS/bin/Release -maxdepth 5 -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          if [[ -z "$APP" ]]; then echo "no .app produced — packaging skipped"; exit 1; fi
          rm -rf payload_stage && mkdir -p payload_stage/Payload
          cp -R "$APP" payload_stage/Payload/
          ( cd payload_stage && zip -qr ../torii-ios-aotgfx-unsigned.ipa Payload )
          ls -la torii-ios-aotgfx-unsigned.ipa

      - name: Upload unsigned .ipa
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: torii-ios-aotgfx-unsigned-ipa
          path: torii-ios-aotgfx-unsigned.ipa
          if-no-files-found: warn
