name: Build SDL3 iOS (pencil coalesced patch)

# compila el SDL3.framework de iOS patcheado con coalesced touches (recupera el 240hz del Apple
# Pencil que SDL hoy colapsa a ~120). base = ppy.SDL3-CS tag 2026.520.0 (submodulo libsdl-org/SDL
# @ f31ca02, el mismo pin que usa toriirefresh-framework). el binario resultante se inyecta despues
# en el .ipa (post-build cp, porque SDL3 es un dylib cargado por P/Invoke, el AOT no lo linkea estatico).
# NO es cmake: es el SDL.xcodeproj + xcodebuild. corre al pushear ESTA branch.
on:
  push:
    branches: [ ci/sdl-pencil ]
  workflow_dispatch:

jobs:
  build-sdl:
    name: Build patched SDL3.framework (ios-arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout toriirefresh (trae el patch script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout ppy/SDL3-CS @ 2026.520.0 (recursive -> SDL submodule pineado)
        uses: actions/checkout@v4
        with:
          repository: ppy/SDL3-CS
          ref: '2026.520.0'
          submodules: recursive
          path: sdl3cs

      - name: Use Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Patch SDL_uikitview.m (coalesced touches)
        shell: bash
        run: |
          set -e
          SRC="sdl3cs/External/SDL/src/video/uikit/SDL_uikitview.m"
          echo "SDL submodule HEAD:"
          git -C sdl3cs/External/SDL rev-parse HEAD || true
          if [[ ! -f "$SRC" ]]; then echo "ERROR: no encontre $SRC"; exit 1; fi
          python3 sdl-pencil-patch/patch_uikitview.py "$SRC"
          echo "--- confirmacion (coalesced presente) ---"
          grep -n "coalescedTouchesForTouch" "$SRC" || { echo "ERROR: patch no aplico"; exit 1; }

      - name: Build SDL3.xcframework (xcodebuild)
        shell: bash
        run: |
          set -x
          XCPROJ=$(find sdl3cs/External/SDL/Xcode -maxdepth 3 -name "SDL.xcodeproj" -type d | head -1)
          echo "xcodeproj: $XCPROJ"
          if [[ -z "$XCPROJ" ]]; then echo "ERROR: no encontre SDL.xcodeproj"; exit 1; fi
          echo "--- targets disponibles ---"
          xcodebuild -project "$XCPROJ" -list || true
          xcodebuild -project "$XCPROJ" \
            -target "SDL3.xcframework" \
            -configuration Release \
            SYMROOT="$PWD/sdlbuild" || \
          xcodebuild -project "$XCPROJ" \
            -scheme "SDL3.xcframework" \
            -configuration Release \
            -derivedDataPath "$PWD/sdlderived"

      - name: Locate + stage the device SDL3 binary
        id: stage
        shell: bash
        run: |
          set -x
          # el xcframework final (el log dice: .../Xcode/SDL/build/SDL3.xcframework, + copia en native/ios/)
          XCF=$(find sdl3cs -name "SDL3.xcframework" -type d 2>/dev/null | head -1)
          echo "xcframework: $XCF"
          if [[ -z "$XCF" ]]; then echo "ERROR: no encontre el SDL3.xcframework"; exit 1; fi
          echo "=== slices del xcframework ==="
          ls -la "$XCF"
          # el slice de device iOS: 'ios-arm64' exacto (NO ios-arm64_x86_64-simulator, NO tvos/xros)
          SLICE=$(ls "$XCF" | grep -xE 'ios-arm64' | head -1)
          if [[ -z "$SLICE" ]]; then
            SLICE=$(ls "$XCF" | grep -E '^ios-arm64' | grep -viE 'simulator' | head -1)
          fi
          echo "slice device: $SLICE"
          if [[ -z "$SLICE" ]]; then echo "ERROR: no encontre el slice ios-arm64 device"; exit 1; fi
          echo "=== contenido del framework device ==="
          ls -la "$XCF/$SLICE/SDL3.framework/"
          BIN="$XCF/$SLICE/SDL3.framework/SDL3"
          if [[ ! -e "$BIN" ]]; then echo "ERROR: no existe $BIN"; exit 1; fi
          mkdir -p out
          cp -L "$BIN" out/SDL3   # -L sigue el symlink SDL3 -> Versions/Current/SDL3
          echo "=== binario staged ==="
          ls -la out/SDL3
          file out/SDL3
          file out/SDL3 | grep -qi "arm64" || { echo "ERROR: no es arm64"; exit 1; }

      - name: Upload patched SDL3 binary
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-ios-arm64-pencil
          path: out/SDL3
          if-no-files-found: warn
