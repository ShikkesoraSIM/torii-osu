name: Build iOS Nova (unsigned .ipa)

# nova (rebuild limpio de Torii sobre ppy/osu-framework, ppy.Veldrid STOCK, sin Vortice/D3D12)
# buildeado como VANILLA: net8.0-ios + full AOT + trim SdkOnly (que en net8 SI funciona) = binario
# nativo ~266MB, suave, PERO con todos los features de nova. net10-ios quedo descartado: su ILLink
# crashea trimmeando (IL1012) y el no-trim tarda una eternidad. net8 = receta probada de vanilla.
# corre al pushear ESTA branch; no toca releases.
on:
  push:
    branches: [ ios-nova-port ]
  workflow_dispatch:

env:
  # framework limpio net8: core net8.0 + osu.Framework.iOS net8.0-ios (nova-unlimited-nocap original)
  FRAMEWORK_REPOSITORY: 'ShikkesoraSIM/torii-framework'
  FRAMEWORK_REF: '0dd6db86b438c3236e577b6875c85ea48aab4888'
  RESOURCES_REPOSITORY: 'ShikkesoraSIM/torii-resources'
  RESOURCES_REF: 'e2442fadd68e5d440ca807295e700b2b7a6b8aaf'

jobs:
  build-ios-nova:
    name: Build iOS Nova (net8, clean framework, full AOT, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout framework dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRAMEWORK_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.FRAMEWORK_REF }}
          path: toriirefresh-framework

      - name: Checkout resources dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESOURCES_REPOSITORY }}
          fetch-depth: 1
          ref: ${{ env.RESOURCES_REF }}
          path: toriirefresh-resources

      - name: Place dependencies in expected sibling paths
        shell: bash
        run: |
          rm -rf ../toriirefresh-framework ../toriirefresh-resources
          mv toriirefresh-framework ../toriirefresh-framework
          mv toriirefresh-resources ../toriirefresh-resources
          echo "--- siblings ---"
          ls -la .. | grep toriirefresh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # el repo pinea net10 en global.json; lo pisamos por net8 (el juego ya esta a net8 en esta branch)
      # y ABORTAMOS si no quedo en 8.x.
      - name: Force .NET 8 SDK + verify
        shell: bash
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF
          V=$(dotnet --version)
          echo "dotnet --version = $V"
          case "$V" in 8.*) echo "OK net8" ;; *) echo "ERROR: no es net8 (es $V)"; exit 1 ;; esac

      - name: Use Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Install iOS workload (net8 band)
        shell: bash
        run: |
          dotnet workload install ios
          echo "--- workloads ---"
          dotnet workload list

      # receta de vanilla: full AOT (MtouchInterpreter=-all) + trim SdkOnly (default). el framework
      # limpio usa ppy.Veldrid stock -> el AOT no crashea (no hay Vortice). binario nativo ~266MB.
      - name: Build device .app + package unsigned .ipa
        id: pack
        shell: bash
        run: |
          set -x
          dotnet build osu.iOS/osu.iOS.csproj -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:_IsDedupEnabled=false \
            -p:CheckEolWorkloads=false \
            -p:CheckEolTargetFramework=false \
            -p:TreatWarningsAsErrors=false \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:CodesignKey= \
            -p:ArchiveOnBuild=false
          APP=$(find osu.iOS/bin/Release -maxdepth 5 -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          if [[ -z "$APP" ]]; then echo "no .app produced"; exit 1; fi
          rm -rf payload_stage && mkdir -p payload_stage/Payload
          cp -R "$APP" payload_stage/Payload/
          # torii pencil #2: inyectar el SDL3 patcheado (coalesced touches -> 240hz apple pencil) pisando
          # el del NuGet. SDL3 es un dylib cargado por P/Invoke, el AOT NO lo linkea estatico, asi que
          # pisar el binario es transparente; sideload re-firma todo el .app al instalar (cero fricción firma).
          SDLDST="payload_stage/Payload/$(basename "$APP")/Frameworks/SDL3.framework/SDL3"
          if [[ ! -f "$SDLDST" ]]; then echo "ERROR: no encontre SDL3 en el bundle: $SDLDST"; ls -la "payload_stage/Payload/$(basename "$APP")/Frameworks/" || true; exit 1; fi
          cp -f sdl-pencil-patch/ios-arm64/SDL3.framework/SDL3 "$SDLDST"
          echo "SDL3 patcheado (pencil coalesced 240hz) inyectado en el bundle"
          file "$SDLDST"
          ( cd payload_stage && zip -qr ../torii-ios-nova-pencil-unsigned.ipa Payload )
          ls -la torii-ios-nova-pencil-unsigned.ipa

      - name: Upload unsigned .ipa
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: torii-ios-nova-pencil-unsigned-ipa
          path: torii-ios-nova-pencil-unsigned.ipa
          if-no-files-found: warn
