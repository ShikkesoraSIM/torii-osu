on: [push, pull_request]
name: Continuous Integration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin framework + resources + veldrid by commit hash, mirroring
      # build-gu.yml's env. Without these pins the Code Quality job
      # clones each dep at its default branch — which is what release
      # builds are NOT consuming — so inspections would run against a
      # different codebase than what ships. Worse, the framework's
      # feat/d3d12 branch references Torii.Veldrid (not on nuget.org)
      # so the unpinned restore would also fail outright.
      - name: Checkout osu-framework dependency
        uses: actions/checkout@v4
        with:
          repository: ShikkesoraSIM/torii-framework
          fetch-depth: 1
          ref: d540460ad28899d49e079339f54c95c1afc3bedf
          path: osu-framework

      - name: Checkout osu-resources dependency
        uses: actions/checkout@v4
        with:
          repository: ShikkesoraSIM/torii-resources
          fetch-depth: 1
          ref: 25ad583064fb19ecd604813446226cb5c0c7bd35
          path: osu-resources

      - name: Checkout torii-veldrid dependency
        # IMPORTANT: fetch-depth: 0 (full history) — torii-veldrid uses
        # Nerdbank.GitVersioning to derive the package version from the
        # commit history (height since `4.9.0` was set in version.json
        # → e.g. `4.9.120-g99a6ad4a0c`). A shallow clone (`fetch-depth: 1`)
        # makes NB.GV unable to count commits and the `dotnet pack` step
        # below fails outright. The repo is small; full clone is fast.
        uses: actions/checkout@v4
        with:
          repository: ShikkesoraSIM/torii-veldrid
          fetch-depth: 0
          ref: 99a6ad4a0c52ad08e3f01d5b7731c18d333f0086
          path: torii-veldrid

      - name: Place dependencies in expected sibling paths
        shell: bash
        run: |
          rm -rf ../osu-framework ../osu-resources ../torii-veldrid
          mv osu-framework ../osu-framework
          mv osu-resources ../osu-resources
          mv torii-veldrid ../torii-veldrid

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack Torii.Veldrid into local NuGet feed
        # Torii.Veldrid is not published to nuget.org — the framework
        # PackageReference resolves through the `torii-veldrid-local`
        # source in nuget.config (../torii-veldrid/bin/Packages/Release).
        # Producing the nupkgs here before restore is the same dance
        # build-gu.yml does.
        shell: bash
        run: |
          cd ../torii-veldrid
          for proj in src/Veldrid/Veldrid.csproj src/Veldrid.MetalBindings/Veldrid.MetalBindings.csproj src/Veldrid.OpenGLBindings/Veldrid.OpenGLBindings.csproj; do
            [[ -f "$proj" ]] && dotnet pack "$proj" -c Release -o bin/Packages/Release --nologo
          done

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu.Desktop/osu.Desktop.csproj --configfile nuget.config

      - name: Restore inspectcode cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu.sln*', 'osu*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug osu.Desktop/osu.Desktop.csproj -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        continue-on-error: true
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        continue-on-error: true
        run: dotnet jb inspectcode $(pwd)/osu.Desktop/osu.Desktop.csproj --no-build --output="inspectcodereport.xml" --caches-home="inspectcode" --verbosity=WARN

      - name: NVika
        continue-on-error: true
        run: dotnet nvika parsereport "${{github.workspace}}/inspectcodereport.xml" --treatwarningsaserrors

  test:
    name: Test
    # disabled per request: keep only code quality checks
    if: ${{ false }}
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Windows, fullname: windows-latest }
            # macOS runner performance has gotten unbearably slow so let's turn them off temporarily.
            # - { prettyname: macOS, fullname: macos-latest }
            - { prettyname: Linux, fullname: ubuntu-latest }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compile
        run: dotnet build -c Debug -warnaserror osu.Desktop.slnf

      - name: Test
        run: >
          dotnet test
          osu.Game.Tests/bin/Debug/**/osu.Game.Tests.dll
          osu.Game.Rulesets.Osu.Tests/bin/Debug/**/osu.Game.Rulesets.Osu.Tests.dll
          osu.Game.Rulesets.Taiko.Tests/bin/Debug/**/osu.Game.Rulesets.Taiko.Tests.dll
          osu.Game.Rulesets.Catch.Tests/bin/Debug/**/osu.Game.Rulesets.Catch.Tests.dll
          osu.Game.Rulesets.Mania.Tests/bin/Debug/**/osu.Game.Rulesets.Mania.Tests.dll
          osu.Game.Tournament.Tests/bin/Debug/**/osu.Game.Tournament.Tests.dll
          Templates/**/*.Tests/bin/Debug/**/*.Tests.dll
          --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}.trx"
          --
          NUnit.ConsoleOut=0

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#always
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: osu-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}.trx

  build-only-android:
    name: Build only (Android)
    # disabled per request: keep only code quality checks
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 11

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install .NET workloads
        run: dotnet workload install android

      - name: Compile
        run: dotnet build -c Debug osu.Android.slnf

  build-only-ios:
    name: Build only (iOS)
    # disabled per request: keep only code quality checks
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install .NET Workloads
        run: dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Build
        run: dotnet build -c Debug osu.iOS.slnf
